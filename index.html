
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<title>AI作文修改器</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px;
  background: #f1f5f9;
  font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
  color: #1e293b;
}

.container {
  max-width: 750px;
  margin: auto;
  background: white;
  padding: 22px;
  border-radius: 16px;
}

h1 {
  text-align: center;
  color: #2563eb;
}

p { line-height: 1.7; }

label {
  display: block;
  margin-top: 18px;
  font-weight: bold;
}

textarea, select {
  width: 100%;
  padding: 13px;
  margin-top: 8px;
  border: 1px solid #cbd5e1;
  border-radius: 9px;
  font-size: 16px;
  font-family: inherit;
}

textarea {
  height: 250px;
  resize: vertical;
  line-height: 1.7;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 15px;
  background: #2563eb;
  color: white;
  border: none;
  border-radius: 9px;
  font-size: 16px;
}

.result {
  margin-top: 20px;
  padding: 16px;
  background: #eff6ff;
  border-radius: 10px;
  white-space: pre-wrap;
  line-height: 1.8;
  overflow-wrap: anywhere;
}

.small {
  color: #64748b;
  font-size: 13px;
}
</style>
</head>

<body>
<div class="container">

<h1>AI作文修改器</h1>
<p>欢迎使用初中作文智能分析工具！</p>

<label for="grade">选择年级</label>
<select id="grade">
<option>初三</option>
<option>初二</option>
<option>初一</option>
</select>

<label for="essay">请输入你的作文</label>
<textarea id="essay" placeholder="请在这里粘贴作文……"></textarea>

<button id="reviewBtn">开始分析作文</button>

<div id="result" class="result">
等待输入作文……
</div>

<p class="small">
当前版本提供基础结构分析和修改建议，尚未接入真正的AI模型。
</p>

</div>

<script src="./app.js"></script>
</body>
</html>
